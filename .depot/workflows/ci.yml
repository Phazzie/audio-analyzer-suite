name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: depot-ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/ci.lock

      - name: Install audio libraries
        run: |
          if command -v sudo >/dev/null 2>&1 && sudo -n true >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends libsndfile1
          else
            apt-get update
            apt-get install -y --no-install-recommends libsndfile1
          fi

      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements/ci.lock

      - name: Compile sources
        run: python -m compileall -q client server

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Smoke tests
        run: python -m unittest discover -s tests -v

      - name: AI review script tests
        run: node --test scripts/ai-review.test.mjs

      - name: AI review skips without a key
        env:
          XAI_API_KEY: ""
        run: node scripts/ai-review.mjs

  ai-review:
    if: github.event_name == 'pull_request'
    runs-on: depot-ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Grok review
        env:
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_BASE_REF: ${{ github.base_ref }}
        run: node scripts/ai-review.mjs
